[project]
name = "alpha-scanner"
version = "0.1.0"
description = "Read-only crypto alpha scanner (Phase One of a staged research/trading platform)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 135

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E731"]
